# ~/.tmux.conf — tested with tmux 3.8.

# --- prefix ------------------------------------------------------------------
# Default prefix is Ctrl-b. Ctrl-a clashes with readline's beginning-of-line,
# so this config keeps Ctrl-b.
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# --- behaviour ---------------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on

# --- splits ------------------------------------------------------------------
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# --- reload ------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# --- status bar --------------------------------------------------------------
set -g status-bg colour235
set -g status-fg colour136
set -g status-left '#[fg=green]#S #[fg=white]| '
set -g status-right '#[fg=white]%H:%M '
set -g status-interval 5
setw -g window-status-current-style fg=black,bg=colour136

# --- clipboard ---------------------------------------------------------------
set -g set-clipboard on
